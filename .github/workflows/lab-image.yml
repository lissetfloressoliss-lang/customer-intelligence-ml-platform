name: Build laboratory image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t novatel-churn-api:lab .
      - run: docker save novatel-churn-api:lab | gzip > novatel-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: novatel-image
          path: novatel-image.tar.gz
          retention-days: 1
